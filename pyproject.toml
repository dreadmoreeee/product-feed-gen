[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "product-feed-gen"
version = "0.1.0"
description = "Validate a product CSV and generate Google Merchant, Meta catalog and JSON-LD feeds, with Canadian defaults."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Marvin Palencia", email = "237541863+dreadmoreeee@users.noreply.github.com" }]
keywords = ["google-merchant-center", "product-feed", "schema.org", "json-ld", "canada", "ecommerce"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = []

[project.urls]
Homepage = "https://marvin.demarkstudio.ca"

[project.scripts]
product-feed-gen = "product_feed_gen.cli:main"

[tool.setuptools]
packages = ["product_feed_gen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
